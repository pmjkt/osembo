<script>
let WK=50;const TILL="3563482",FEE=150,W=13,PREVIEW=false,NOLOGIN=false;

function promote(){if(me().role!=="admin")return;let n=0;S.st.forEach(s=>{if(s.left)return;const[g,sm]=s.cls.split(" ");if(g==="9")s.left=1;else s.cls=(+g+1)+" "+sm;s.pays={};n++});S.week=1;ui.week=1;S.hand=[];S.hol={};LOG("Year-end promotion, "+n+" students");save();cm();R();T("Promoted "+n+" students")}
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove();T("Downloading "+n)}
function bak(){S.lastBak=Date.now();LOG("Backup downloaded");save();dl("osembo-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(S),"application/json")}
function rest(i){const f=i.files[0];if(!f||me().role!=="admin")return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.st)throw 0;S=d;fix();save();R();T("Backup restored")}catch(e){T("That is not an Osembo backup")}i.value=""};r.readAsText(f)}
function exp(){const u=me(),ad=u.role==="admin",wk=Array.from({length:W},(_,i)=>i+1),rows=[["Class","Adm","Name","Parent","Phone",...wk.map(w=>"Week "+w),"Total","Owes"]];
  live().filter(s=>ad?(!ui.cls||s.cls===ui.cls):s.cls===u.cls).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name)).forEach(s=>rows.push([s.cls,s.adm||"",s.name,s.parent||"",s.phone||"",...wk.map(w=>amt(s,w)||""),sum(s.pays),arrears(s)]));
  LOG("Exported report");save();dl("osembo-report.csv",CSVX(rows),"text/csv")}
function CSVX(rows){return rows.map(r=>r.map(v=>{v=String(v);if(/^[=+\-@]/.test(v)&&isNaN(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(",")).join("\n")}
function qk(id){const s=S.st.find(x=>x.id===id);if(!s||!canEdit(s.cls))return;if(amt(s,ui.week)>=WK)delete s.pays[ui.week];else s.pays[ui.week]=WK;LOG(s.name+" week "+ui.week+": "+(amt(s,ui.week)?"paid":"cleared"));save();R()}
function editM(id){const s=S.st.find(x=>x.id===id);if(!s||!canEdit(s.cls))return;const ad=me().role==="admin";ui.cf=null;
  M(`<div class="ov" onclick="if(event.target===this)cm()"><div class="sheet" style="max-height:90vh;overflow:auto"><h3>Edit student</h3><label>Full name</label><input id="e1" value="${esc(s.name)}"><label>Admission number</label><input id="e0" value="${esc(s.adm||"")}"><label>Parent / guardian name</label><input id="e2" value="${esc(s.parent||"")}"><label>Parent phone</label><input id="e3" value="${esc(s.phone||"")}">${ad?`<label>Class (change it to transfer)</label><select id="e4">${CL.map(c=>`<option ${c===s.cls?"selected":""}>${c}</option>`).join("")}</select>`:""}<button class="btn" onclick="saveEdit('${id}')">Save changes</button><button class="btn s" style="margin-top:8px" onclick="leftM('${id}')">Mark as left school</button><button class="btn s" style="margin-top:8px" onclick="cm()">Cancel</button></div></div>`)}
function saveEdit(id){const s=S.st.find(x=>x.id===id);if(!s||!canEdit(s.cls))return;const n=$("#e1").value.trim(),p=$("#e3").value.replace(/\s/g,""),c=$("#e4")?$("#e4").value:s.cls;
  if(!n)return T("Enter a name");if(p&&!/^0[17]\d{8}$/.test(p))return T("Enter a valid phone");const adm=$("#e0")?$("#e0").value.trim():s.adm;if(!adm)return T("Enter an admission number");if(S.st.some(x=>x.id!==id&&String(x.adm)===adm))return T("That admission number is already in use");
  if(inCls(c).some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return T("That name is already in that class");
  LOG(c!==s.cls?n+": moved "+s.cls+" to "+c:"Edited "+n);s.name=n;s.adm=adm;s.parent=$("#e2").value.trim();s.phone=p;s.cls=c;save();cm();R();T("Saved")}
function leftM(id){const s=S.st.find(x=>x.id===id);if(!s||!canEdit(s.cls))return;if(ui.cf!==id){ui.cf=id;return T("Tap Mark as left school again to confirm")}ui.cf=null;s.left=1;LOG(s.name+" marked as left");save();cm();R();T("Marked as left")}
function renameM(id){const u=U(id);M(`<div class="ov" onclick="if(event.target===this)cm()"><div class="sheet"><h3>Class teacher for ${u.cls}</h3><label>Teacher name</label><input id="tn" value="${esc(u.name)}"><label>Login email (the teacher uses this to log in)</label><input id="tem" type="email" value="${esc(u.email||"")}"><button class="btn" onclick="saveName('${id}')">Save</button><button class="btn s" style="margin-top:8px" onclick="cm()">Cancel</button></div></div>`)}
function saveName(id){const n=$("#tn").value.trim(),em=$("#tem").value.trim().toLowerCase();if(!n)return T("Enter a name");if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return T("Enter a valid email");const u=U(id);u.name=n;u.email=em;save();cm();R();T("Saved")}
async function resetT(id){if(me().role!=="admin")return;const u=U(id);if(!u.email)return T("Add the teacher's login email first");const {error}=await sb.auth.resetPasswordForEmail(u.email,{redirectTo:window.location.href});T(error?"Could not send the reset email":"Reset email sent to "+u.email)}
function nextWk(){if(me().role!=="admin"||S.week>=W)return;S.week++;save();ui.week=S.week;R()}
function clearDemo(){if(me().role!=="admin")return;S.st=S.st.filter(s=>!s.demo);S.fp=S.fp.filter(x=>S.st.some(s=>s.id===x.sid));Object.keys(S.res).forEach(k=>{if(!S.st.some(s=>s.id===k.split("|")[3]))delete S.res[k]});save();R();T("Demo students cleared")}

function R(){const a=$("#app");a.innerHTML=!ui.sess?vLogin():vMain();if(ui.tab==="marks"&&ui.sess&&typeof mStats==="function")mStats();if(ui.mfocus){ui.mfocus=0;setTimeout(mFocus,30)}}
boot();
</script></body></html>
